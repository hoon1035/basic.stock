# test.yml — 깃허브에서 직접 test_api.py 돌리기
# 사용법: 깃허브 → Actions 탭 → "API 테스트" → Run workflow 버튼 클릭

name: API 테스트

on:
  workflow_dispatch:   # 수동 실행 버튼 (Actions 탭에서 클릭)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: API 테스트 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python test_api.py
