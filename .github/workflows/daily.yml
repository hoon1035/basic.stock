# daily.yml — 장중 1시간마다 자동 수집 → data.json 커밋
name: 데이터 수집

on:
  schedule:
    # UTC 0~6시 = KST 9~15시 (장중) 매시 정각 + 장마감 후 1번
    - cron: '0 0-6 * * 1-5'    # 장중 매시간 (KST 9~15시)
    - cron: '30 9 * * 1-5'     # KST 18:30 최종 확정
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write             # data.json 커밋 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python collect.py

      - name: data.json 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "데이터 갱신 $(date +'%Y-%m-%d %H:%M')"
          git push
